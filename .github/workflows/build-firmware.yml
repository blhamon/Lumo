name: Build Lumo astronaut firmware

on:
  workflow_dispatch:
  push:
    branches:
      - fix/battery-sleep-timer
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: python -m pip install --upgrade platformio "esptool>=4.8,<6"

      - name: Compile ESP32-S3 firmware
        run: pio run -e lumo

      - name: Verify PlatformIO factory image
        shell: bash
        run: |
          set -euo pipefail
          FACTORY=".pio/build/lumo/firmware.factory.bin"
          test -s "$FACTORY"
          python -m esptool --chip esp32s3 image-info "$FACTORY"
          mkdir -p dist
          cp "$FACTORY" dist/lumo-astronaut-factory.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: lumo-astronaut-firmware
          path: dist/lumo-astronaut-factory.bin
          if-no-files-found: error
          retention-days: 30
